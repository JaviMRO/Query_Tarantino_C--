# Builds and tests the C++ implementation on the three operating systems it supports, and once with MongoDB
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
          - name: macOS (Apple Clang)
            os: macos-latest
          - name: Windows (MSVC)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install icu4c

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Test
        run: ctest --preset release --parallel 4

  mongo:
    name: Linux (GCC) with MongoDB 7.0
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libcurl4-openssl-dev libssl-dev

      - name: Configure
        run: cmake --preset release-mongo

      - name: Build
        run: cmake --build --preset release-mongo --parallel 4

      - name: Test
        run: ctest --preset release-mongo --parallel 4
